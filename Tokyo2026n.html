<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 政大EMBA 東京參訪</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #FFFBEB; color: #334155; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- 錯誤提示區 (預設隱藏) -->
    <div id="error-banner" class="hidden fixed top-0 left-0 w-full bg-red-600 text-white text-center p-4 z-[100] font-bold shadow-lg"></div>

    <!-- Navigation -->
    <nav class="bg-white/90 backdrop-blur-md sticky top-0 z-50 shadow-sm border-b border-orange-100">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 bg-orange-500 rounded-full flex items-center justify-center text-white font-bold">JP</div>
                    <span class="font-bold text-teal-700 tracking-wide text-lg hidden md:block">2026 政大EMBA 東京行</span>
                </div>
                <div class="flex space-x-2 overflow-x-auto no-scrollbar py-2" id="nav-items"></div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main id="app" class="flex-grow pb-12">
        <div class="flex flex-col justify-center items-center h-64 space-y-4">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-teal-500"></div>
            <p class="text-slate-500 animate-pulse">正在連線至 Firebase 資料庫...</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-orange-100 py-8 text-center text-sm text-slate-400 mt-auto">
        <div class="max-w-7xl mx-auto px-4">
            <p>NCCU EMBA Tokyo Trip 2026</p>
        </div>
    </footer>

    <!-- Logic -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        // --- 1. 請在此填入您的 Firebase 設定 ---
        const firebaseConfig = {
            apiKey: "AIzaSyDEg7Hfcc3lyQhHSv_F6CD_7GMUWfxit8Y",
            authDomain: "nccu25gftyo.firebaseapp.com",
            projectId: "nccu25gftyo",
            storageBucket: "nccu25gftyo.firebasestorage.app",
            messagingSenderId: "780094999226",
            appId: "1:780094999226:web:80509ac5bb518fd52ed083"
        };
        
        const appId = 'tokyo-trip-2026-prod'; 
        
        // --- 初始化檢測 ---
        function showError(msg) {
            const el = document.getElementById('error-banner');
            el.innerText = `⚠️ 錯誤: ${msg}`;
            el.classList.remove('hidden');
            console.error(msg);
        }

        if (firebaseConfig.apiKey.includes("貼在這裡")) {
            showError("請用文字編輯器打開 index.html，並填入正確的 Firebase Config！");
            document.getElementById('app').innerHTML = `<div class="p-10 text-center text-red-500 font-bold">尚未設定 Firebase Config，請修改程式碼。</div>`;
            throw new Error("Config missing");
        }

        // Initialize
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // State
        const state = {
            user: null, isAdmin: false, activeTab: 'home',
            data: { itinerary: [], qa: [], team: [] },
            ui: { openQaIndex: null, categoryFilter: 'all', editingId: null, isAddingTeam: false, deletingId: null }
        };

        const NAV_ITEMS = [
            { id: 'home', label: '首頁', icon: 'map-pin' },
            { id: 'itinerary', label: '行程', icon: 'camera' },
            { id: 'info', label: '費用', icon: 'dollar-sign' },
            { id: 'academic', label: '學術', icon: 'book-open' },
            { id: 'qa', label: '問答', icon: 'help-circle' },
            { id: 'team', label: '團隊', icon: 'users' },
        ];

        // --- Auth & Listeners ---
        async function init() {
            try {
                await signInAnonymously(auth);
                onAuthStateChanged(auth, (user) => {
                    state.user = user;
                    if (user) {
                        console.log("Logged in:", user.uid);
                        setupListeners();
                    }
                    render();
                });
            } catch (error) {
                showError(`登入失敗: ${error.message} (請確認 Firebase Auth 是否已開啟「匿名登入」)`);
            }
        }

        function setupListeners() {
            // Itinerary
            onSnapshot(query(collection(db, 'artifacts', appId, 'public', 'data', 'itinerary_v2'), orderBy('order')), 
                (snap) => {
                    state.data.itinerary = snap.docs.map(d => ({id: d.id, ...d.data()}));
                    // 如果沒有資料，且不在首頁，嘗試自動 seeding
                    if (state.data.itinerary.length === 0) { console.log("No itinerary found."); }
                    if (state.activeTab === 'itinerary') render();
                },
                (err) => showError(`讀取行程失敗: ${err.message} (請確認 Firestore Rules 是否為 Test Mode)`)
            );

            // QA
            onSnapshot(query(collection(db, 'artifacts', appId, 'public', 'data', 'qa_v2'), orderBy('timestamp', 'desc')), 
                (snap) => {
                    state.data.qa = snap.docs.map(d => ({id: d.id, ...d.data()}));
                    if (state.activeTab === 'qa') render();
                }
            );

            // Team
            onSnapshot(query(collection(db, 'artifacts', appId, 'public', 'data', 'team_contacts_v2')), 
                (snap) => {
                    state.data.team = snap.docs.map(d => ({id: d.id, ...d.data()}));
                    if (state.activeTab === 'team') render();
                }
            );
        }

        // --- Seeding (Manual Trigger) ---
        window.initializeData = async () => {
            if(!confirm("確定要寫入預設資料嗎？這將會新增多筆測試數據。")) return;
            try {
                // Itinerary
                const itinData = [
                    { order: 1, date: '5/13 (三)', title: '啟程與文化體驗', events: [{ type: 'transport', content: '桃園機場 → 成田機場' }, { type: 'attraction', content: '成田山新勝寺 (表參道散策)' }, { type: 'meal', content: '晚餐：和牛霜降肉壽喜燒' }], hotel: '東京巨蛋飯店' },
                    { order: 2, date: '5/14 (四)', title: '學術與金融巡禮', events: [{ type: 'visit', content: '09:30 早稻田大學見學' }, { type: 'meal', content: '午餐：叙叙苑燒肉套餐' }, { type: 'visit', content: '14:00 東京證交所' }, { type: 'attraction', content: '日本橋日枝神社' }, { type: 'meal', content: '晚餐：瓢斗銘柄豚涮涮鍋' }], hotel: '東京萬豪酒店' },
                    { order: 3, date: '5/15 (五)', title: '公共治理與永續', events: [{ type: 'visit', content: '10:00 東京都下水道局見學 (芝浦再生中心)' }, { type: 'visit', content: '15:00 國會參議院見學' }, { type: 'attraction', content: '麻布台之丘' }, { type: 'meal', content: '晚餐：居酒屋料理' }], hotel: '東京萬豪酒店' },
                    { order: 4, date: '5/16 (六)', title: '企業創新與古都', events: [{ type: 'visit', content: '橫濱資生堂全球創新中心 S/PARK' }, { type: 'attraction', content: '高德院 (鎌倉青銅大佛)' }, { type: 'attraction', content: '鶴岡八幡宮 & 小町通' }, { type: 'meal', content: '晚餐：螃蟹道樂晚宴包廂 (酒水暢飲)' }], hotel: '東京萬豪酒店' },
                    { order: 5, date: '5/17 (日)', title: '江戶風情與返程', events: [{ type: 'attraction', content: '小江戶川越 (藏造老街、時光鐘)' }, { type: 'attraction', content: '川越冰川神社 (體驗釣鯛魚籤)' }, { type: 'meal', content: '午餐：川越鰻魚飯御膳' }, { type: 'transport', content: '成田機場 → 桃園機場' }], hotel: '溫暖的家' }
                ];
                for (const item of itinData) await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'itinerary_v2'), item);

                // QA
                const qaData = [
                    { category: '交通', question: '我可以自行購買機票嗎？', answer: '可以。自行購票可扣團費 NT$18,000，但需自行前往第一個參訪點與團隊會合。', timestamp: Date.now() },
                    { category: '住宿', question: '住宿可以安排單人房嗎？', answer: '可以。全程單人房需加價 NT$16,000。', timestamp: Date.now() },
                    { category: '費用', question: '如果報名後需要取消怎麼辦？', answer: '依照旅遊契約書規定辦理。如未達成行率取消，收取退票費$5000；3月初後飯店不退費。', timestamp: Date.now() },
                    { category: '學術', question: '課程學分如何計算？', answer: '本課程為「高階主管投資與理財」，屬於群修二，2學分。需全程參與才能獲得學分。', timestamp: Date.now() }
                ];
                for (const item of qaData) await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'qa_v2'), item);

                // Team
                const teamData = [
                    { name: '林采欣 (Linda)', role: '雄獅旅遊 專案窗口', phone: '(02) 8793-9000 #1691', email: 'lindalin@liontravel.com', type: 'agency', task: '行程總籌、機票住宿' },
                    { name: '愛喻', role: '總召', phone: '', email: '', type: 'student', task: '活動總籌與決策' },
                    { name: '淑卿、幸慧', role: '副總召', phone: '', email: '', type: 'student', task: '協助總召、進度控管' }
                ];
                for (const item of teamData) await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'team_contacts_v2'), item);

                alert("資料初始化成功！");
            } catch (err) {
                showError(`寫入資料失敗: ${err.message} (請確認 Firestore Rules)`);
            }
        };

        // --- Render ---
        function render() {
            renderNav();
            const app = document.getElementById('app');
            app.innerHTML = '';
            
            // Check for Empty Data UI
            const isEmpty = state.data.itinerary.length === 0;

            switch(state.activeTab) {
                case 'home': app.innerHTML = renderHero() + renderInfo(); break;
                case 'itinerary': 
                    if(isEmpty) app.innerHTML = renderEmptyState();
                    else renderItinerary(app); 
                    break;
                case 'info': app.innerHTML = renderCost(); break;
                case 'academic': app.innerHTML = renderAcademic(); break;
                case 'qa': 
                    if(state.data.qa.length === 0) app.innerHTML = renderEmptyState();
                    else renderQA(app); 
                    break;
                case 'team': 
                     if(state.data.team.length === 0) app.innerHTML = renderEmptyState();
                     else renderTeam(app); 
                     break;
                case 'admin': renderAdmin(app); break;
                default: app.innerHTML = renderHero();
            }
            lucide.createIcons();
        }

        function renderNav() {
            const nav = document.getElementById('nav-items');
            nav.innerHTML = NAV_ITEMS.map(item => `
                <button onclick="window.switchTab('${item.id}')" 
                    class="px-3 py-2 rounded-full text-sm font-medium flex items-center gap-1 whitespace-nowrap transition-all duration-300
                    ${state.activeTab === item.id ? 'bg-teal-500 text-white shadow-md' : 'text-slate-500 hover:bg-orange-50'}">
                    <i data-lucide="${item.icon}" class="w-4 h-4"></i><span class="hidden sm:inline ml-1">${item.label}</span>
                </button>
            `).join('');
            
            nav.innerHTML += state.isAdmin ? 
                `<button onclick="window.handleLogout()" class="px-3 py-2 rounded-full text-sm text-red-400 hover:bg-red-50"><i data-lucide="log-out" class="w-4 h-4"></i></button>` :
                `<button onclick="window.switchTab('admin')" class="px-3 py-2 rounded-full text-sm text-slate-400"><i data-lucide="settings" class="w-4 h-4"></i></button>`;
        }

        function renderEmptyState() {
            return `
            <div class="flex flex-col items-center justify-center py-20 text-center px-4 fade-in">
                <i data-lucide="database" class="w-16 h-16 text-slate-300 mb-4"></i>
                <h3 class="text-xl font-bold text-slate-700 mb-2">資料庫目前是空的</h3>
                <p class="text-slate-500 mb-6 max-w-md">可能是第一次載入，或者資料尚未初始化。</p>
                <button onclick="window.initializeData()" class="bg-teal-500 text-white px-6 py-3 rounded-full font-bold shadow-lg hover:bg-teal-600 transition flex items-center">
                    <i data-lucide="download-cloud" class="w-5 h-5 mr-2"></i> 一鍵寫入預設資料
                </button>
                <p class="text-xs text-slate-400 mt-4">注意：需確認 Firestore 權限已設為 Test Mode</p>
            </div>`;
        }

        // --- Content Templates (Same as before, simplified for brevity) ---
        function renderHero() { return `<div class="relative h-[400px] md:h-[500px] rounded-b-[40px] overflow-hidden shadow-xl mx-2 mt-2 fade-in"><img src="https://images.unsplash.com/photo-1503899036084-c55cdd92da26?auto=format&fit=crop&w=1920&q=80" class="absolute inset-0 w-full h-full object-cover"><div class="absolute inset-0 bg-gradient-to-t from-teal-900/80 via-transparent"></div><div class="relative max-w-7xl mx-auto px-6 h-full flex flex-col justify-end pb-16 text-center md:text-left"><h1 class="text-4xl md:text-6xl font-extrabold text-white mb-2">重塑日本競爭力</h1><p class="text-xl text-orange-100">資本、人才與產業的數位轉型及永續革新</p><div class="bg-white/20 px-6 py-2 rounded-full text-white text-sm w-fit mx-auto md:mx-0 mt-4 border border-white/30"><i data-lucide="calendar" class="mr-2 w-4 h-4 inline"></i>2026/05/13 - 05/17</div></div></div>`; }
        function renderInfo() { return `<div class="max-w-6xl mx-auto px-4 py-12 fade-in"><div class="bg-white rounded-2xl shadow-lg border-b-4 border-orange-200 mb-8 overflow-hidden"><div class="bg-orange-400 px-6 py-3 text-white font-bold"><i data-lucide="plane" class="mr-2 inline"></i>航班 (CI 華航)</div><div class="p-6 grid md:grid-cols-2 gap-8"><div class="text-center border-b md:border-b-0 md:border-r border-gray-100 pb-4 md:pb-0"><div class="font-bold text-orange-600">去程 5/13 (三) CI100</div><div class="text-2xl font-bold text-slate-700 my-2">08:55 ➝ 13:15</div><div class="text-sm text-slate-400">桃園 T2 ➝ 成田 T2</div></div><div class="text-center"><div class="font-bold text-teal-600">回程 5/17 (日) CI105</div><div class="text-2xl font-bold text-slate-700 my-2">17:55 ➝ 20:35</div><div class="text-sm text-slate-400">成田 T2 ➝ 桃園 T2</div></div></div></div></div>`; }
        function renderCost() { return `<div class="max-w-4xl mx-auto px-4 py-8 fade-in"><div class="bg-white rounded-3xl shadow-lg overflow-hidden border-t-8 border-orange-400"><div class="p-8 text-center bg-orange-50"><p class="text-sm text-slate-500 mb-2">每人團費 (35人成團)</p><div class="text-5xl font-extrabold text-slate-800 mb-2">NT$ 63,500</div><span class="bg-white text-orange-600 px-4 py-1 rounded-full text-sm font-bold shadow-sm">訂金 NT$ 15,000</span></div></div></div>`; }
        function renderAcademic() { return `<div class="max-w-4xl mx-auto px-4 py-8 fade-in"><div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-100"><h3 class="text-2xl font-bold text-teal-800 mb-4">高階主管投資與理財</h3><p class="text-slate-600 mb-4">境外參訪 (日本東京) | 2 學分 | 陳鴻毅 教授</p><div class="bg-red-50 p-4 rounded-xl text-red-700 text-sm font-bold">⚠️ 重要：需全程參與，缺席視為不及格。</div></div></div>`; }

        function renderItinerary(container) {
            let html = `<div class="max-w-4xl mx-auto px-4 py-8 fade-in space-y-6">`;
            state.data.itinerary.forEach(day => {
                const isEditing = state.ui.editingId === day.id;
                html += `<div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden relative">
                    <div class="absolute top-0 left-0 w-2 h-full bg-gradient-to-b from-teal-400 to-teal-600"></div>
                    <div class="p-6 pl-8">
                        <div class="flex justify-between items-baseline mb-4">
                            <h3 class="text-xl font-bold text-slate-800"><span class="text-teal-600 mr-2">DAY ${day.order}</span>${isEditing ? `<input id="edit-title-${day.id}" value="${day.title}" class="border p-1 rounded">` : day.title}</h3>
                            ${state.isAdmin ? (isEditing ? `<button onclick="window.saveItinerary('${day.id}')" class="text-teal-600 text-sm">儲存</button>` : `<button onclick="window.setEditingId('${day.id}')" class="text-slate-300 hover:text-teal-500"><i data-lucide="edit-2" class="w-4 h-4"></i></button>`) : ''}
                        </div>
                        <div class="space-y-2 border-l-2 border-slate-100 pl-4 ml-1 mb-4">
                            ${day.events.map(ev => `<p class="text-sm text-slate-700 py-1"><span class="font-bold text-slate-400 mr-2">[${ev.type==='visit'?'參訪':ev.type==='meal'?'餐食':'景點'}]</span>${ev.content}</p>`).join('')}
                        </div>
                        <div class="text-sm text-slate-500 bg-slate-50 p-2 rounded w-fit"><i data-lucide="hotel" class="w-3 h-3 inline mr-1"></i>${isEditing ? `<input id="edit-hotel-${day.id}" value="${day.hotel}" class="border p-1 rounded text-xs">` : day.hotel}</div>
                    </div>
                </div>`;
            });
            container.innerHTML = html + `</div>`;
        }

        function renderQA(container) {
             const filtered = state.ui.categoryFilter === 'all' ? state.data.qa : state.data.qa.filter(i => i.category === state.ui.categoryFilter);
             let html = `<div class="max-w-3xl mx-auto px-4 py-8 fade-in space-y-4">
                <div class="flex gap-2 mb-4 overflow-x-auto pb-2">${['all','一般','住宿','交通','學術','費用'].map(c => `<button onclick="window.setCategory('${c}')" class="px-3 py-1 rounded-full text-xs font-bold ${state.ui.categoryFilter===c ? 'bg-teal-500 text-white':'bg-white border text-slate-500'}">${c==='all'?'全部':c}</button>`).join('')}</div>
                ${state.isAdmin ? `<div class="bg-white p-4 rounded-xl border-2 border-dashed mb-4"><input id="qa-q" placeholder="問題" class="w-full border p-2 mb-2 rounded text-sm"><textarea id="qa-a" placeholder="回答" class="w-full border p-2 mb-2 rounded text-sm"></textarea><button onclick="window.addQA()" class="bg-teal-500 text-white px-4 py-1 rounded text-sm">新增</button></div>` : ''}
                ${filtered.map((item, idx) => `<div class="bg-white rounded-xl shadow-sm border p-4"><div onclick="window.toggleQA(${idx})" class="font-bold text-slate-700 flex justify-between cursor-pointer"><span><span class="text-xs bg-gray-100 text-gray-500 px-2 rounded mr-2">${item.category||'一般'}</span>${item.question}</span><i data-lucide="${state.ui.openQaIndex===idx?'chevron-up':'chevron-down'}" class="w-4 h-4 text-slate-300"></i></div>${state.ui.openQaIndex===idx ? `<div class="mt-3 text-sm text-slate-600 border-t pt-2">${item.answer}${state.isAdmin?`<div class="text-right mt-2"><button onclick="window.deleteDoc('qa_v2','${item.id}')" class="text-red-400 text-xs">刪除</button></div>`:''}</div>` : ''}</div>`).join('')}
             </div>`;
             container.innerHTML = html;
        }

        function renderTeam(container) {
            let html = `<div class="max-w-4xl mx-auto px-4 py-8 fade-in grid md:grid-cols-2 gap-6">`;
            state.data.team.forEach(c => {
                html += `<div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 relative">
                    ${state.isAdmin ? `<button onclick="window.deleteDoc('team_contacts_v2','${c.id}')" class="absolute top-2 right-2 text-slate-300 hover:text-red-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button>`:''}
                    <div class="flex items-center mb-3"><div class="w-10 h-10 rounded-full flex items-center justify-center mr-3 font-bold text-lg ${c.type==='agency'?'bg-orange-100 text-orange-600':'bg-teal-100 text-teal-600'}">${c.name[0]}</div><div><h4 class="font-bold text-slate-800">${c.name}</h4><p class="text-xs text-slate-500">${c.role}</p></div></div>
                    ${c.task ? `<div class="text-xs bg-amber-50 p-2 rounded text-amber-800 mb-2">任務：${c.task}</div>`:''}
                    <div class="text-xs text-slate-400">${c.phone||''} ${c.email||''}</div>
                </div>`;
            });
            if(state.isAdmin) html += `<div onclick="window.addTeamPrompt()" class="bg-gray-50 border-2 border-dashed rounded-2xl flex items-center justify-center p-6 text-gray-400 cursor-pointer hover:border-teal-400"><i data-lucide="plus"></i></div>`;
            container.innerHTML = html + `</div>`;
        }

        function renderAdmin(container) {
            container.innerHTML = `<div class="min-h-[60vh] flex items-center justify-center bg-orange-50/50 px-4 fade-in">${state.isAdmin ? `<div class="text-center"><h2 class="text-2xl font-bold mb-4 text-teal-800">已登入後台</h2><p class="mb-6 text-slate-500">請直接點選上方選單 (行程、QA、團隊) 進行編輯。</p><button onclick="window.handleLogout()" class="bg-red-400 text-white px-6 py-2 rounded-full">登出</button></div>` : `<div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-md"><h2 class="text-2xl font-bold text-center text-teal-800 mb-6">團隊登入</h2><form onsubmit="event.preventDefault(); window.login();" class="space-y-4"><input id="login-user" type="text" placeholder="帳號" class="w-full p-3 border rounded-xl"><input id="login-pass" type="password" placeholder="密碼" class="w-full p-3 border rounded-xl"><button type="submit" class="w-full bg-teal-500 text-white py-3 rounded-xl font-bold">登入</button></form></div>`}</div>`;
        }

        // --- Global Actions ---
        window.switchTab = (t) => { state.activeTab = t; render(); };
        window.login = () => { if(document.getElementById('login-user').value==='admin' && document.getElementById('login-pass').value==='Aa123456#') { state.isAdmin = true; state.activeTab='itinerary'; render(); } else alert('帳號密碼錯誤'); };
        window.handleLogout = () => { state.isAdmin=false; state.activeTab='home'; render(); };
        window.setEditingId = (id) => { state.ui.editingId = id; render(); };
        window.saveItinerary = async (id) => { await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'itinerary_v2', id), { title: document.getElementById(`edit-title-${id}`).value, hotel: document.getElementById(`edit-hotel-${id}`).value }); state.ui.editingId = null; render(); };
        window.setCategory = (c) => { state.ui.categoryFilter = c; render(); };
        window.toggleQA = (i) => { state.ui.openQaIndex = state.ui.openQaIndex===i?null:i; render(); };
        window.addQA = async () => { const q=document.getElementById('qa-q').value, a=document.getElementById('qa-a').value; if(q&&a) await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'qa_v2'), {question:q, answer:a, category:'一般', timestamp:Date.now()}); render(); };
        window.deleteDoc = async (col, id) => { if(confirm('刪除?')) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', col, id)); };
        window.addTeamPrompt = async () => { const n=prompt('姓名'); if(n) await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'team_contacts_v2'), {name:n, role:'成員', type:'student'}); };

        init();
    </script>
</body>
</html>
