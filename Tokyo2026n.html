        import { getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        const firebaseConfig = {
              apiKey: "AIzaSyDEg7Hfcc3lyQhHSv_F6CD_7GMUWfxit8Y",
              authDomain: "nccu25gftyo.firebaseapp.com",

              appId: "1:780094999226:web:80509ac5bb518fd52ed083"

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- State Management ---
        const state = {
            user: null,
            isAdmin: false,
            activeTab: 'home',
            data: {
                itinerary: [],
                qa: [],
                team: []
            },
            ui: {
                openQaIndex: null,
                categoryFilter: 'all',
                editingId: null, // For generic inline editing
                isAddingTeam: false,
                deletingId: null // For delete confirmation
            }
        };

        // --- Constants ---
        const NAV_ITEMS = [
            { id: 'home', label: '旅程首頁', icon: 'map-pin' },
            { id: 'itinerary', label: '精彩行程', icon: 'camera' },
            { id: 'info', label: '費用須知', icon: 'dollar-sign' },
            { id: 'academic', label: '學術任務', icon: 'book-open' },
            { id: 'qa', label: '問答集', icon: 'help-circle' },
            { id: 'team', label: '找團隊', icon: 'users' },
        ];

        // --- Init ---
        async function init() {
            // Auth
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }

            onAuthStateChanged(auth, (user) => {
                state.user = user;
                if (user) {
                    setupListeners();
                }
                render();
            });
        }

        function setupListeners() {
            // Itinerary Listener
            const itinQ = query(collection(db, 'artifacts', appId, 'public', 'data', 'itinerary_v2'), orderBy('order'));
            onSnapshot(itinQ, (snapshot) => {
                state.data.itinerary = snapshot.docs.map(d => ({id: d.id, ...d.data()}));
                if (state.data.itinerary.length === 0) seedItinerary();
                if (state.activeTab === 'itinerary') render();
            });

            // QA Listener
            const qaQ = query(collection(db, 'artifacts', appId, 'public', 'data', 'qa_v2'), orderBy('timestamp', 'desc'));
            onSnapshot(qaQ, (snapshot) => {
                state.data.qa = snapshot.docs.map(d => ({id: d.id, ...d.data()}));
                if (state.data.qa.length === 0) seedQA();
                if (state.activeTab === 'qa') render();
            });

            // Team Listener
            const teamQ = query(collection(db, 'artifacts', appId, 'public', 'data', 'team_contacts_v2'));
            onSnapshot(teamQ, (snapshot) => {
                state.data.team = snapshot.docs.map(d => ({id: d.id, ...d.data()}));
                if (state.data.team.length === 0) seedTeam();
                if (state.activeTab === 'team') render();
            });
        }

        // --- Seeding Data (If empty) ---
        async function seedItinerary() {
             const data = [
                { order: 1, date: '5/13 (三)', title: '啟程與文化體驗', events: [{ type: 'transport', content: '桃園機場 → 成田機場' }, { type: 'attraction', content: '成田山新勝寺 (表參道散策)' }, { type: 'meal', content: '晚餐：和牛霜降肉壽喜燒' }], hotel: '東京巨蛋飯店' },
                { order: 2, date: '5/14 (四)', title: '學術與金融巡禮', events: [{ type: 'visit', content: '09:30 早稻田大學見學' }, { type: 'meal', content: '午餐：叙叙苑燒肉套餐' }, { type: 'visit', content: '14:00 東京證交所' }, { type: 'attraction', content: '日本橋日枝神社' }, { type: 'meal', content: '晚餐：瓢斗銘柄豚涮涮鍋' }], hotel: '東京萬豪酒店' },
                { order: 3, date: '5/15 (五)', title: '公共治理與永續', events: [{ type: 'visit', content: '10:00 東京都下水道局見學 (芝浦再生中心)' }, { type: 'visit', content: '15:00 國會參議院見學' }, { type: 'attraction', content: '麻布台之丘' }, { type: 'meal', content: '晚餐：居酒屋料理' }], hotel: '東京萬豪酒店' },
                { order: 4, date: '5/16 (六)', title: '企業創新與古都', events: [{ type: 'visit', content: '橫濱資生堂全球創新中心 S/PARK' }, { type: 'attraction', content: '高德院 (鎌倉青銅大佛)' }, { type: 'attraction', content: '鶴岡八幡宮 & 小町通' }, { type: 'meal', content: '晚餐：螃蟹道樂晚宴包廂 (酒水暢飲)' }], hotel: '東京萬豪酒店' },
                { order: 5, date: '5/17 (日)', title: '江戶風情與返程', events: [{ type: 'attraction', content: '小江戶川越 (藏造老街、時光鐘)' }, { type: 'attraction', content: '川越冰川神社 (體驗釣鯛魚籤)' }, { type: 'meal', content: '午餐：川越鰻魚飯御膳' }, { type: 'transport', content: '成田機場 → 桃園機場' }], hotel: '溫暖的家' }
            ];
            for (const item of data) await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'itinerary_v2'), item);
        }

        async function seedQA() {
            const data = [
                { category: '交通', question: '我可以自行購買機票嗎？', answer: '可以。自行購票可扣團費 NT$18,000，但需自行前往第一個參訪點與團隊會合。', timestamp: Date.now() },
                { category: '住宿', question: '住宿可以安排單人房嗎？', answer: '可以。全程單人房需加價 NT$16,000。', timestamp: Date.now() },
                { category: '費用', question: '如果報名後需要取消怎麼辦？', answer: '依照旅遊契約書規定辦理。如未達成行率取消，收取退票費$5000；3月初後飯店不退費。', timestamp: Date.now() },
                { category: '學術', question: '課程學分如何計算？', answer: '本課程為「高階主管投資與理財」，屬於群修二，2學分。需全程參與才能獲得學分。', timestamp: Date.now() }
            ];
            for (const item of data) await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'qa_v2'), item);
        }

        async function seedTeam() {
             const data = [
                { name: '林采欣 (Linda)', role: '雄獅旅遊 專案窗口', phone: '(02) 8793-9000 #1691', email: 'lindalin@liontravel.com', type: 'agency', task: '行程總籌、機票住宿' },
                { name: '愛喻', role: '總召', phone: '', email: '', type: 'student', task: '活動總籌與決策' },
                { name: '淑卿、幸慧', role: '副總召', phone: '', email: '', type: 'student', task: '協助總召、進度控管' }
            ];
            for (const item of data) await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'team_contacts_v2'), item);
        }

        // --- Rendering Logic ---

        function render() {
            renderNav();
            const app = document.getElementById('app');
            app.innerHTML = ''; // Clear content

            switch(state.activeTab) {
                case 'home': app.innerHTML = renderHero() + renderInfo(); break;
                case 'itinerary': renderItinerary(app); break;
                case 'info': app.innerHTML = renderCost(); break;
                case 'academic': app.innerHTML = renderAcademic(); break;
                case 'qa': renderQA(app); break;
                case 'team': renderTeam(app); break;
                case 'admin': renderAdmin(app); break;
                default: app.innerHTML = renderHero();
            }
            lucide.createIcons(); // Re-init icons
        }

        function renderNav() {
            const navContainer = document.getElementById('nav-items');
            navContainer.innerHTML = NAV_ITEMS.map(item => `
                <button onclick="window.switchTab('${item.id}')" 
                    class="px-3 py-2 rounded-full text-sm font-medium flex items-center gap-1 whitespace-nowrap transition-all duration-300

                    <i data-lucide="${item.icon}" class="w-4 h-4"></i>
                    <span class="hidden sm:inline">${item.label}</span>
                </button>
            `).join('');

            // Admin/Logout Button
            if (state.isAdmin) {
                navContainer.innerHTML += `
                    <button onclick="window.handleLogout()" class="px-3 py-2 rounded-full text-sm text-red-400 hover:bg-red-50">
                        <i data-lucide="log-out" class="w-4 h-4"></i>
                    </button>`;
            } else {
                navContainer.innerHTML += `
                    <button onclick="window.switchTab('admin')" class="px-3 py-2 rounded-full text-sm ${state.activeTab === 'admin' ? 'text-teal-600' : 'text-slate-400'}">
                        <i data-lucide="settings" class="w-4 h-4"></i>
                    </button>`;
            }
        }

                    <span class="inline-block bg-yellow-400 text-teal-900 px-4 py-1 rounded-full font-bold text-sm mb-4 w-fit mx-auto md:mx-0 shadow-lg animate-bounce">Lion, Enriching Life!</span>
                    <h1 class="text-4xl md:text-6xl font-extrabold text-white mb-2 drop-shadow-md">重塑日本競爭力</h1>
                    <p class="text-xl md:text-2xl text-orange-100 font-medium mb-6">資本、人才與產業的數位轉型及永續革新</p>
                    <div class="bg-white/20 backdrop-blur-sm px-6 py-2 rounded-full text-white text-sm flex items-center border border-white/30 w-fit mx-auto md:mx-0">
                        <i data-lucide="calendar" class="mr-2 w-4 h-4"></i> 2026/05/13 - 05/17
                    </div>

        }

            <div class="max-w-6xl mx-auto px-4 py-12 fade-in">
                <!-- Flight -->

                    <div class="bg-orange-400 px-6 py-3 flex justify-between items-center text-white">

                                <span class="bg-teal-200 text-teal-800 px-2 rounded text-xs py-1">CI105</span>
                            </div>

        function renderItinerary(container) {

                <div class="space-y-8">`;

            state.data.itinerary.forEach(day => {
                const isEditing = state.ui.editingId === day.id;
                
                html += `
                <div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden relative">
                    <div class="absolute top-0 left-0 w-2 h-full bg-gradient-to-b from-teal-400 to-teal-600"></div>
                    <div class="p-6 pl-8">
                        <div class="flex justify-between items-start mb-6">
                            <div class="flex flex-col md:flex-row md:items-baseline gap-2">
                                <span class="text-teal-600 font-extrabold text-sm uppercase bg-teal-50 px-3 py-1 rounded-full">DAY ${day.order}</span>
                                ${isEditing ? 
                                    `<input id="edit-title-${day.id}" value="${day.title}" class="border p-1 rounded font-bold text-lg text-slate-800">` : 
                                    `<h3 class="text-2xl font-bold text-slate-800"><span class="mr-3 text-slate-500 text-lg font-medium">${day.date}</span>${day.title}</h3>`
                                }
                            </div>
                            ${state.isAdmin ? (isEditing ? 
                                `<div class="flex gap-2">
                                    <button onclick="window.saveItinerary('${day.id}')" class="bg-teal-500 text-white px-3 py-1 rounded text-sm">儲存</button>

                                `<button onclick="window.setEditingId('${day.id}')" class="text-slate-300 hover:text-teal-500"><i data-lucide="edit-2" class="w-4 h-4"></i></button>`
                            ) : ''}
                        </div>
                        
                        <div class="space-y-3 mb-6 relative">

                            ${day.events.map(ev => {
                                let badgeClass = "bg-gray-100 text-gray-500";

                                if(ev.type === 'visit') { badgeClass = "bg-blue-100 text-blue-700"; label = "參訪"; icon = "briefcase"; }

                </div>`;
            });
            html += `</div></div>`;
            container.innerHTML = html;
        }

        function renderCost() {
            return `
            <div class="max-w-4xl mx-auto px-4 py-8 fade-in">
                <h2 class="text-2xl font-bold text-teal-800 mb-8 flex items-center"><i data-lucide="dollar-sign" class="mr-3 text-orange-500"></i> 費用與行政</h2>
                <div class="bg-white rounded-3xl shadow-lg overflow-hidden mb-8 border-t-8 border-orange-400">
                    <div class="p-8 text-center bg-orange-50">
                        <p class="text-sm text-slate-500 mb-2">每人團費 (35人成團)</p>
                        <div class="text-5xl font-extrabold text-slate-800 mb-2">NT$ 63,500</div>
                        <span class="inline-block bg-white text-orange-600 px-4 py-1 rounded-full text-sm font-bold shadow-sm">訂金 NT$ 15,000</span>
                    </div>
                    <div class="p-8 bg-white grid md:grid-cols-2 gap-10">
                        <div>
                            <h4 class="font-bold text-teal-700 mb-4 pb-2 border-b border-teal-100">費用包含</h4>
                            <ul class="space-y-3 text-sm text-slate-600">
                                <li class="flex items-center"><span class="w-5 h-5 bg-teal-100 rounded-full flex items-center justify-center text-teal-600 text-xs mr-3">✓</span>機票 (華航團體經濟艙)</li>
                                <li class="flex items-center"><span class="w-5 h-5 bg-teal-100 rounded-full flex items-center justify-center text-teal-600 text-xs mr-3">✓</span>住宿 (二人一室)</li>
                                <li class="flex items-center"><span class="w-5 h-5 bg-teal-100 rounded-full flex items-center justify-center text-teal-600 text-xs mr-3">✓</span>交通 & 門票 & 保險</li>
                            </ul>
                        </div>
                        <div>
                            <h4 class="font-bold text-orange-600 mb-4 pb-2 border-b border-orange-100">加價/減免</h4>
                            <ul class="space-y-3 text-sm text-slate-600">
                                <li class="flex items-center bg-blue-50 p-2 rounded-lg"><span class="font-bold text-blue-600 mr-2">★</span> 單人房加價: +NT$ 16,000</li>
                                <li class="flex items-center bg-orange-50 p-2 rounded-lg"><span class="font-bold text-orange-600 mr-2">★</span> 機票自理扣除: -NT$ 18,000</li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>`;
        }

        function renderAcademic() {
            return `
            <div class="max-w-4xl mx-auto px-4 py-8 fade-in">
                <h2 class="text-2xl font-bold text-teal-800 mb-8 flex items-center"><i data-lucide="book-open" class="mr-3 text-orange-500"></i> 學術任務與課綱</h2>
                <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-100">
                    <div class="bg-gradient-to-r from-teal-500 to-teal-600 text-white p-6 rounded-2xl mb-8 shadow-md relative overflow-hidden">
                        <div class="relative z-10">
                            <div class="flex items-center gap-2 mb-2"><i data-lucide="graduation-cap" class="text-yellow-300"></i><span class="text-yellow-100 font-bold text-sm">114學年第二學期</span></div>
                            <h3 class="text-3xl font-bold mb-2">高階主管投資與理財</h3>
                            <p class="opacity-90 text-base">境外參訪 (日本東京) | 2 學分 | 授課教師：陳鴻毅 教授</p>
                        </div>
                    </div>
                    <div class="grid md:grid-cols-3 gap-4 mb-8">
                        <div class="bg-slate-50 p-5 rounded-xl text-center border border-slate-200"><div class="font-bold text-slate-500 text-sm">行前課程</div><div class="text-xl font-bold text-slate-800">5/11 (一)</div></div>
                        <div class="bg-orange-50 p-5 rounded-xl text-center border-2 border-orange-200 shadow-lg transform md:-translate-y-2"><div class="font-bold text-orange-600 text-sm">參訪期間</div><div class="text-xl font-bold text-orange-700">5/13 - 5/17</div></div>
                        <div class="bg-slate-50 p-5 rounded-xl text-center border border-slate-200"><div class="font-bold text-slate-500 text-sm">回程課程</div><div class="text-xl font-bold text-slate-800">5/25 (一)</div></div>
                    </div>
                     <div class="mt-8 bg-red-50 p-4 rounded-xl border border-red-100 flex items-start">
                        <span class="text-red-500 mr-3 text-xl">⚠️</span>
                        <div><p class="text-red-700 text-base font-bold">重要提醒</p><p class="text-red-600 text-sm">境外參訪行程，所有修課學生務必「全程參與」。若有缺席，將視為課程不及格。</p></div>
                    </div>
                </div>
            </div>`;
        }

        function renderQA(container) {
            const categories = ['一般', '住宿', '交通', '學術', '費用'];
            const filtered = state.ui.categoryFilter === 'all' ? state.data.qa : state.data.qa.filter(i => i.category === state.ui.categoryFilter);

            let html = `
            <div class="max-w-3xl mx-auto px-4 py-8 fade-in">
                <h2 class="text-2xl font-bold text-teal-800 mb-8 flex items-center"><i data-lucide="help-circle" class="mr-3 text-orange-500"></i> 旅遊問答集</h2>
                
                <div class="flex flex-wrap gap-2 mb-6">
                    <button onclick="window.setCategory('all')" class="px-4 py-1.5 rounded-full text-sm font-medium transition-all ${state.ui.categoryFilter === 'all' ? 'bg-orange-500 text-white' : 'bg-white border hover:bg-orange-50'}">全部</button>
                    ${categories.map(c => `<button onclick="window.setCategory('${c}')" class="px-4 py-1.5 rounded-full text-sm font-medium transition-all ${state.ui.categoryFilter === c ? 'bg-teal-500 text-white' : 'bg-white border hover:bg-teal-50'}">${c}</button>`).join('')}
                </div>

                ${state.isAdmin ? `
                <div class="bg-white p-6 rounded-2xl mb-8 border-2 border-dashed border-teal-200">
                    <h4 class="font-bold text-teal-700 mb-4 flex items-center"><i data-lucide="plus" class="mr-2"></i>新增 Q&A</h4>
                    <div class="flex gap-2 mb-2">
                        <select id="qa-cat" class="p-2 border rounded text-sm bg-gray-50">${categories.map(c => `<option value="${c}">${c}</option>`)}</select>
                        <input id="qa-q" class="flex-1 p-2 border rounded text-sm" placeholder="輸入問題...">
                    </div>
                    <textarea id="qa-a" class="w-full p-2 mb-2 border rounded text-sm h-20" placeholder="輸入回答..."></textarea>
                    <button onclick="window.addQA()" class="bg-teal-500 text-white px-6 py-2 rounded-full font-bold text-sm shadow-md">發布</button>
                </div>` : ''}

                <div class="space-y-4">
                    ${filtered.map((item, idx) => `
                        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                            <button onclick="window.toggleQA(${idx})" class="w-full px-6 py-4 text-left flex justify-between items-center hover:bg-gray-50">
                                <div class="flex items-center gap-3">
                                    <span class="text-xs bg-gray-100 text-gray-500 px-2 py-0.5 rounded">${item.category || '一般'}</span>
                                    <span class="font-bold text-slate-700 text-base-custom">${item.question}</span>
                                </div>
                                <i data-lucide="${state.ui.openQaIndex === idx ? 'chevron-up' : 'chevron-down'}" class="text-slate-300"></i>
                            </button>
                            ${state.ui.openQaIndex === idx ? `
                                <div class="px-6 py-4 bg-orange-50/50 border-t border-orange-100 text-slate-600 text-sm leading-relaxed">
                                    ${item.answer}
                                    ${state.isAdmin ? `
                                        <div class="mt-2 text-right">
                                            <button onclick="window.deleteQA('${item.id}')" class="text-red-400 text-xs hover:underline">刪除此題</button>
                                        </div>` : ''}
                                </div>` : ''}
                        </div>
                    `).join('')}
                </div>
            </div>`;
            container.innerHTML = html;
        }

        function renderTeam(container) {
            let html = `
            <div class="max-w-4xl mx-auto px-4 py-8 fade-in">
                <h2 class="text-2xl font-bold text-teal-800 mb-8 flex items-center"><i data-lucide="users" class="mr-3 text-orange-500"></i> 籌備團隊與聯絡</h2>
                <div class="grid md:grid-cols-2 gap-6">`;
            
            state.data.team.forEach(contact => {
                const confirmDelete = state.ui.deletingId === contact.id;
                html += `
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 relative group hover:shadow-md transition">
                    ${state.isAdmin ? (confirmDelete ? 
                        `<div class="absolute top-2 right-2 flex gap-1 z-20 bg-white p-1 rounded border">
                            <button onclick="window.doDeleteTeam('${contact.id}')" class="bg-red-500 text-white text-xs px-2 py-1 rounded">確認</button>
                            <button onclick="window.setDeletingTeam(null)" class="bg-gray-200 text-xs px-2 py-1 rounded">取消</button>
                        </div>` :
                        `<button onclick="window.setDeletingTeam('${contact.id}')" class="absolute top-2 right-2 text-red-300 hover:text-red-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button>`
                    ) : ''}
                    
                    <div class="flex items-center mb-3">
                        <div class="w-12 h-12 rounded-full flex items-center justify-center mr-3 font-bold text-xl flex-shrink-0 ${contact.type === 'agency' ? 'bg-orange-100 text-orange-600' : 'bg-teal-100 text-teal-600'}">
                            ${contact.name[0]}
                        </div>
                        <div>
                            <h4 class="font-bold text-slate-800">${contact.name}</h4>
                            <p class="text-sm text-slate-500">${contact.role}</p>
                        </div>
                    </div>
                    ${contact.task ? `<div class="mb-3 bg-amber-50 px-3 py-2 rounded-lg border border-amber-100 text-sm text-amber-800"><span class="font-bold">任務：</span>${contact.task}</div>` : ''}
                    <div class="space-y-1 pl-1 text-sm text-slate-600">
                        ${contact.phone ? `<div class="flex items-center"><i data-lucide="phone" class="w-3 h-3 mr-2 opacity-50"></i>${contact.phone}</div>` : ''}
                        ${contact.email ? `<div class="flex items-center"><i data-lucide="file-text" class="w-3 h-3 mr-2 opacity-50"></i>${contact.email}</div>` : ''}
                    </div>
                </div>`;
            });

            if (state.isAdmin) {
                html += state.ui.isAddingTeam ? `
                <div class="bg-white p-6 rounded-2xl border-2 border-teal-400 shadow-md">
                    <h4 class="text-teal-700 font-bold mb-2">新增成員</h4>
                    <div class="space-y-2">
                        <input id="new-team-name" placeholder="姓名" class="w-full p-2 border rounded text-sm">
                        <input id="new-team-role" placeholder="職稱" class="w-full p-2 border rounded text-sm">
                        <input id="new-team-task" placeholder="任務" class="w-full p-2 border rounded text-sm">
                        <input id="new-team-phone" placeholder="電話" class="w-full p-2 border rounded text-sm">
                        <input id="new-team-email" placeholder="Email" class="w-full p-2 border rounded text-sm">
                        <div class="flex gap-2 pt-2">
                            <button onclick="window.saveTeam()" class="flex-1 bg-teal-500 text-white py-1 rounded text-sm">確認</button>
                            <button onclick="window.toggleAddTeam(false)" class="flex-1 bg-gray-200 text-slate-600 py-1 rounded text-sm">取消</button>
                        </div>
                    </div>
                </div>` : 
                `<div onclick="window.toggleAddTeam(true)" class="bg-gray-50 border-2 border-dashed border-gray-300 rounded-2xl flex flex-col items-center justify-center p-6 text-gray-400 hover:bg-white hover:border-teal-400 cursor-pointer h-full min-h-[150px]">
                    <i data-lucide="plus" class="w-8 h-8 mb-2"></i>
                    <span>新增聯絡人</span>
                </div>`;
            }

            html += `</div></div>`;
            container.innerHTML = html;
        }

        function renderAdmin(container) {
            container.innerHTML = `
            <div class="min-h-[60vh] flex items-center justify-center bg-orange-50/50 px-4 fade-in">
                ${state.isAdmin ? 
                    `<div class="text-center">
                        <h2 class="text-2xl font-bold mb-4 text-teal-800">歡迎回到管理後台</h2>
                        <p class="text-slate-500 mb-6">請點選上方選單 (行程、Q&A、團隊) 直接進行編輯。</p>
                        <button onclick="window.handleLogout()" class="bg-red-400 text-white px-6 py-2 rounded-full">登出系統</button>
                     </div>` :
                    `<div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-md border border-orange-100">
                        <h2 class="text-2xl font-bold text-center text-teal-800 mb-6">團隊登入</h2>
                        <form onsubmit="event.preventDefault(); window.login();" class="space-y-4">
                            <input id="login-user" type="text" placeholder="帳號" class="w-full p-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 outline-none">
                            <input id="login-pass" type="password" placeholder="密碼" class="w-full p-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 outline-none">
                            <button type="submit" class="w-full bg-teal-500 text-white py-3 rounded-xl font-bold hover:bg-teal-600 shadow-lg">登入管理系統</button>
                        </form>
                    </div>`
                }
            </div>`;
        }


        // --- Actions (Window Globals for HTML Onclick) ---

        window.switchTab = (tab) => { state.activeTab = tab; render(); };
        
        window.login = () => {
            const u = document.getElementById('login-user').value;
            const p = document.getElementById('login-pass').value;
            if(u === 'admin' && p === 'Aa123456#') {
                state.isAdmin = true;
                state.activeTab = 'itinerary';
                render();
            } else {
                alert('帳號或密碼錯誤');
            }
        };

        window.handleLogout = () => {
            state.isAdmin = false;
            state.activeTab = 'home';
            render();
        };

        // Itinerary Actions
        window.setEditingId = (id) => { state.ui.editingId = id; render(); };
        window.saveItinerary = async (id) => {
            const title = document.getElementById(`edit-title-${id}`).value;
            const hotel = document.getElementById(`edit-hotel-${id}`).value;
            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'itinerary_v2', id), { title, hotel });
            state.ui.editingId = null;
            render();
        };

        // QA Actions
        window.setCategory = (c) => { state.ui.categoryFilter = c; render(); };
        window.toggleQA = (idx) => { state.ui.openQaIndex = state.ui.openQaIndex === idx ? null : idx; render(); };
        window.addQA = async () => {
            const q = document.getElementById('qa-q').value;
            const a = document.getElementById('qa-a').value;
            const c = document.getElementById('qa-cat').value;
            if(!q || !a) return;
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'qa_v2'), {
                question: q, answer: a, category: c, timestamp: Date.now()
            });
            render(); // Re-render to clear inputs implied
        };
        window.deleteQA = async (id) => {
            if(confirm('確定刪除？')) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'qa_v2', id));
        };

        // Team Actions
        window.setDeletingTeam = (id) => { state.ui.deletingId = id; render(); };
        window.doDeleteTeam = async (id) => {
            await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'team_contacts_v2', id));
            state.ui.deletingId = null;
            render(); // Will trigger snapshot update
        };
        window.toggleAddTeam = (val) => { state.ui.isAddingTeam = val; render(); };
        window.saveTeam = async () => {
            const name = document.getElementById('new-team-name').value;
            if(!name) return;
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'team_contacts_v2'), {
                name,
                role: document.getElementById('new-team-role').value,
                task: document.getElementById('new-team-task').value,
                phone: document.getElementById('new-team-phone').value,
                email: document.getElementById('new-team-email').value,
                type: 'student'
            });
            state.ui.isAddingTeam = false;
        };

        // Start
        init();

    </script>
</body>
</html>
