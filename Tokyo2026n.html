function renderTeam(container) {
            // 定義排序權重邏輯
            const getRoleWeight = (member) => {
                // 權重 1: 總召 (包含"總召"且不含"副")
                if (member.role.includes('總召') && !member.role.includes('副')) return 1;
                // 權重 2: 副總召
                if (member.role.includes('副總召')) return 2;
                // 權重 3: 其他學生團隊
                if (member.type === 'student') return 3;
                // 權重 4: 旅行社/廠商
                if (member.type === 'agency') return 4;
                // 權重 5: 其他
                return 5;
            };

            // 執行排序 (淺拷貝陣列以免影響原始數據順序)
            const sortedTeam = [...state.data.team].sort((a, b) => {
                return getRoleWeight(a) - getRoleWeight(b);
            });

            let html = `
            <div class="max-w-5xl mx-auto px-4 py-12 fade-in">

                </select>
                
                <div class="flex-1 space-y-2">
                    <input class="event-content w-full border border-slate-300 rounded p-2 text-sm font-bold text-slate-700" placeholder="行程標題">
                    <textarea class="event-desc w-full border border-slate-300 rounded p-2 text-xs text-slate-600 h-16 resize-none focus:ring-1 focus:ring-teal-200 outline-none" placeholder="景點描述與說明 (選填)"></textarea>
                    <div class="flex items-center gap-2">
                        <i data-lucide="map-pin" class="w-3 h-3 text-slate-400"></i>
                        <input class="event-map w-full border border-slate-300 rounded p-1 text-xs text-slate-500" placeholder="Google Map 網址 (選填)">
                    </div>
                </div>
                
                <button onclick="this.closest('.event-row').remove()" class="text-red-300 hover:text-red-500 p-2 hover:bg-red-50 rounded transition ml-1"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
            `;
            container.appendChild(div);
            lucide.createIcons();
        };


        window.addItineraryDay = async () => {
            const lastOrder = state.data.itinerary.length > 0 ? Math.max(...state.data.itinerary.map(d => d.order)) : 0;
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'itinerary_v2'), {
                order: lastOrder + 1,
                date: '日期',
                title: '新行程',
                hotel: '住宿',
                events: []
            });
        };
        window.deleteItineraryDay = async (id) => {
            if(confirm('確定要刪除整天的行程嗎？此動作無法復原。')) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'itinerary_v2', id));
        };

        // QA Actions
        window.setCategory = (c) => { state.ui.categoryFilter = c; render(); };
        window.toggleQA = (i) => { state.ui.openQaIndex = state.ui.openQaIndex===i?null:i; render(); };
        window.setQaSearch = (val) => { state.ui.qaSearch = val; render(); };
        window.openQaModal = (id = null) => { state.ui.qaModal = { open: true, id: id }; render(); };
        window.closeQaModal = () => { state.ui.qaModal = { open: false, id: null }; render(); };
        window.saveQaModal = async () => {
            const id = state.ui.qaModal.id;
            const data = {
                category: document.getElementById('modal-qa-cat').value,
                question: document.getElementById('modal-qa-q').value,
                answer: document.getElementById('modal-qa-a').value,
                timestamp: Date.now()
            };
            if (!data.question || !data.answer) { alert('請填寫完整內容'); return; }
            if (id) {
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'qa_v2', id), data);
            } else {
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'qa_v2'), data);
            }
            window.closeQaModal();
        };

        // Team Modal Actions
        window.openTeamModal = (id = null) => { state.ui.teamModal = { open: true, id: id }; render(); };
        window.closeTeamModal = () => { state.ui.teamModal = { open: false, id: null }; render(); };
        window.saveTeamMember = async () => {
            const id = state.ui.teamModal.id;
            const data = {
                name: document.getElementById('tm-name').value,
                role: document.getElementById('tm-role').value,
                task: document.getElementById('tm-task').value,
                phone: document.getElementById('tm-phone').value,
                email: document.getElementById('tm-email').value,
                type: document.getElementById('tm-type').value,
            };
            if (!data.name) { alert('請輸入姓名'); return; }
            if (id) {
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'team_contacts_v2', id), data);
            } else {
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'team_contacts_v2'), data);
            }
            window.closeTeamModal();
        };

        // --- 留言板 Logic ---
        window.toggleMsgModal = () => { 
            state.ui.msgModal.open = !state.ui.msgModal.open; 
            render(); 
        };

        window.submitMessage = async () => {
            const name = document.getElementById('msg-name').value;
            const contact = document.getElementById('msg-contact').value;
            const content = document.getElementById('msg-content').value;

            if(!name || !content) {
                alert('請填寫姓名與內容！');
                return;
            }

            try {
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'inquiries'), {
                    name, contact, content, 
                    timestamp: Date.now(),
                    status: 'unread'
                });
                alert('留言已送出！');
                state.ui.msgModal.open = false;
                render();
            } catch(e) {
                alert('發送失敗: ' + e.message);
            }
        };
        // --- Admin Account Logic ---
        window.openAdminModal = (id = null) => { state.ui.adminModal = { open: true, id: id }; render(); };
        window.closeAdminModal = () => { state.ui.adminModal = { open: false, id: null }; render(); };
        
        window.saveAdmin = async () => {
            const id = state.ui.adminModal.id;
            const name = document.getElementById('adm-name').value;
            const username = document.getElementById('adm-user').value;
            const password = document.getElementById('adm-pass').value;
            const role = document.getElementById('adm-role').value;

            if (!name || !username || !password) { alert('請填寫完整資料'); return; }

            const data = { name, username, password, role, timestamp: Date.now() };

            if (id) {
                // 更新 (重設密碼)
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'admins', id), {
                    name, password, role // username 通常不給改
                });
            } else {
                // 新增 (檢查帳號是否重複 - 簡易版直接新增，實務上應檢查)
                const exists = state.data.admins.some(a => a.username === username);
                if(exists) { alert('此帳號已存在！'); return; }
                
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'admins'), data);
            }
            window.closeAdminModal();
        };

        // 修改 Logout，清除權限
        window.handleLogout = () => { 
            state.isAdmin = false; 
            state.role = 'guest'; 
            state.activeTab = 'home'; 
            render(); 
        };

        // --- Message Processing Logic ---
        window.openMsgProcessModal = (id) => { 
            state.ui.msgProcessModal = { open: true, id: id }; 
            render(); 
        };
        
        window.closeMsgProcessModal = () => { 
            state.ui.msgProcessModal = { open: false, id: null }; 
            render(); 
        };
        
        window.saveMsgProcess = async () => {
            const id = state.ui.msgProcessModal.id;
            const category = document.getElementById('msg-cat').value;
            const note = document.getElementById('msg-note').value;

            try {
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'inquiries', id), {
                    category, note
                });
                window.closeMsgProcessModal();
            } catch(e) {
                alert('更新失敗: ' + e.message);
            }
        };

        // --- Event Sorting Logic ---
        window.moveEvent = (btn, direction) => {
            const row = btn.closest('.event-row'); // 找到當前這行
            const container = row.parentElement; // 找到容器
            
            if (direction === 'up') {
                const prev = row.previousElementSibling;
                // 如果有上一個元素，就插在它前面
                if (prev) {
                    container.insertBefore(row, prev);
                }
            } else if (direction === 'down') {
                const next = row.nextElementSibling;
                // 如果有下一個元素，就插在它後面 (即插在下下個元素之前)
                if (next) {
                    container.insertBefore(next, row); 
                }
            }
        };        
        
        init();
    </script>
</body>
</html>
