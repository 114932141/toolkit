    // ==================== 圓餅圖組件 ====================
    function PieChart({ data, size = 200 }) {
      const total = data.reduce((sum, item) => sum + item.value, 0);
      let currentAngle = 0;

      const createArc = (startAngle, endAngle, color, index) => {
        const start = (startAngle - 90) * Math.PI / 180;
        const end = (endAngle - 90) * Math.PI / 180;
        const radius = size / 2 - 10;
        const cx = size / 2;
        const cy = size / 2;

        const x1 = cx + radius * Math.cos(start);
        const y1 = cy + radius * Math.sin(start);
        const x2 = cx + radius * Math.cos(end);
        const y2 = cy + radius * Math.sin(end);

        const largeArc = endAngle - startAngle > 180 ? 1 : 0;

        return (
          <path
            key={index}
            d={`M ${cx} ${cy} L ${x1} ${y1} A ${radius} ${radius} 0 ${largeArc} 1 ${x2} ${y2} Z`}
            fill={color}
            className="hover:opacity-80 transition-opacity cursor-pointer"
          />
        );
      };

      const arcs = data.map((item, index) => {
        const angle = (item.value / total) * 360;
        const arc = createArc(currentAngle, currentAngle + angle, chartColors[index % chartColors.length], index);
        currentAngle += angle;
        return arc;
      });

      return (
        <svg width={size} height={size} className="mx-auto">
          {arcs}
          <circle cx={size/2} cy={size/2} r={size/4} fill="#1e293b" />
          <text x={size/2} y={size/2 - 10} textAnchor="middle" fill="white" fontSize="14" fontWeight="bold">
            總支出
          </text>
          <text x={size/2} y={size/2 + 15} textAnchor="middle" fill="#fbbf24" fontSize="16" fontWeight="bold">
            ${total.toLocaleString()}
          </text>
        </svg>
      );
    }

          setError('帳號或密碼錯誤');

      return (

                    }`}

                      form.role === 'normal' ? 'bg-blue-500/20 text-blue-400 border border-blue-500/50' : 'bg-slate-800 text-slate-400'

                儲存

          </div>

    }

    // ==================== 活動專區 ====================
    function EventsSection({ events, isAdmin, canEdit, onSave, showNotif }) {
      const [showEditor, setShowEditor] = useState(false);
      const [editingEvent, setEditingEvent] = useState(null);
      const [showArchive, setShowArchive] = useState(false);
      const [showRegForm, setShowRegForm] = useState(null);
      const [showRegList, setShowRegList] = useState(null);
      const [showDetail, setShowDetail] = useState(null);

      const activeEvents = events.filter(e => e.status === 'active');
      const archivedEvents = events.filter(e => e.status === 'archived');

      const handleSave = (event) => {
        if (editingEvent) {
          const updated = events.map(e => e.id === event.id ? event : e);
          onSave(updated);
          showNotif('活動更新成功');
        } else {
          onSave([{ ...event, id: Date.now().toString(), registrations: [] }, ...events]);
          showNotif('活動新增成功');
        }
        setShowEditor(false);
        setEditingEvent(null);
      };

      const handleDelete = (id) => {
        if (confirm('確定要刪除此活動？')) {
          onSave(events.filter(e => e.id !== id));
          showNotif('活動已刪除');
        }
      };

      const handleArchive = (id) => {
        const updated = events.map(e => e.id === id ? { ...e, status: 'archived' } : e);
        onSave(updated);
        showNotif('活動已歸檔');
      };

      const handleRestore = (id) => {
        const updated = events.map(e => e.id === id ? { ...e, status: 'active' } : e);
        onSave(updated);
        showNotif('活動已恢復');
      };

      const handleRegister = (eventId, regData) => {
        const updated = events.map(e => {
          if (e.id === eventId) {
            return {
              ...e,
              registrations: [...(e.registrations || []), { ...regData, id: Date.now().toString(), date: new Date().toISOString().split('T')[0] }]
            };
          }
          return e;
        });
        onSave(updated);
        showNotif('報名成功！');
        setShowRegForm(null);
      };

      const handleDeleteReg = (eventId, regId) => {
        if (confirm('確定要刪除此報名紀錄？')) {
          const updated = events.map(e => {
            if (e.id === eventId) {
              return { ...e, registrations: e.registrations.filter(r => r.id !== regId) };
            }
            return e;
          });
          onSave(updated);
          showNotif('報名紀錄已刪除');
        }
      };

      return (
        <div className="space-y-8">
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
              <h2 className="text-2xl font-bold text-white flex items-center gap-3">
                <span className="text-amber-400"><Icons.Calendar /></span>
                活動專區
              </h2>
              <p className="text-slate-400 mt-1">探索精彩活動，拓展人脈視野</p>
            </div>
            
            <div className="flex gap-3">
              <button
                onClick={() => setShowArchive(!showArchive)}
                className={`flex items-center gap-2 px-4 py-2 rounded-lg transition-all ${
                  showArchive ? 'bg-amber-400/20 text-amber-400' : 'bg-white/5 text-slate-400 hover:bg-white/10'
                }`}
              >
                <Icons.Archive />
                歷史活動 ({archivedEvents.length})
              </button>
              
              {canEdit && (
                <button
                  onClick={() => { setEditingEvent(null); setShowEditor(true); }}
                  className="gold-gradient text-slate-900 font-semibold px-5 py-2 rounded-lg flex items-center gap-2 hover:opacity-90 transition-opacity"
                >
                  <Icons.Plus />
                  新增活動
                </button>
              )}
            </div>
          </div>

          <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
            {(showArchive ? archivedEvents : activeEvents).map(event => (
              <div key={event.id} className="glass rounded-2xl overflow-hidden hover-lift group">
                <div className="relative h-48 overflow-hidden">
                  <img 
                    src={event.imageUrl || 'https://images.unsplash.com/photo-1540575467063-178a50c2df87?w=800'} 
                    alt={event.title}
                    className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
                  />
                  <div className="absolute inset-0 bg-gradient-to-t from-slate-900/80 to-transparent" />
                  <div className="absolute bottom-4 left-4 right-4">
                    <span className={`inline-block px-3 py-1 rounded-full text-xs font-medium ${
                      event.status === 'active' ? 'bg-emerald-500/80 text-white' : 'bg-slate-600/80 text-slate-300'
                    }`}>
                      {event.status === 'active' ? '報名中' : '已結束'}
                    </span>
                  </div>
                  
                  {canEdit && (
                    <div className="absolute top-3 right-3 flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                      <button 
                        onClick={() => { setEditingEvent(event); setShowEditor(true); }}
                        className="p-2 bg-white/20 backdrop-blur rounded-lg text-white hover:bg-white/30"
                      >
                        <Icons.Edit3 />
                      </button>
                      {event.status === 'active' ? (
                        <button 
                          onClick={() => handleArchive(event.id)}
                          className="p-2 bg-amber-500/20 backdrop-blur rounded-lg text-amber-400 hover:bg-amber-500/30"
                        >
                          <Icons.Archive />
                        </button>
                      ) : (
                        <button 
                          onClick={() => handleRestore(event.id)}
                          className="p-2 bg-emerald-500/20 backdrop-blur rounded-lg text-emerald-400 hover:bg-emerald-500/30"
                        >
                          <Icons.Check />
                        </button>
                      )}
                      <button 
                        onClick={() => handleDelete(event.id)}
                        className="p-2 bg-red-500/20 backdrop-blur rounded-lg text-red-400 hover:bg-red-500/30"
                      >
                        <Icons.Trash2 />
                      </button>
                    </div>
                  )}
                </div>
                
                <div className="p-5">
                  <h3 
                    onClick={() => setShowDetail(event)}
                    className="text-lg font-semibold text-white mb-2 cursor-pointer hover:text-amber-400 transition-colors"
                  >
                    {event.title}
                  </h3>
                  <div className="flex items-center gap-2 text-amber-400 text-sm mb-3">
                    <Icons.Clock />
                    {event.date}{event.endDate !== event.date && ` ~ ${event.endDate}`}
                  </div>
                  <p className="text-slate-400 text-sm line-clamp-3 mb-4">{event.content}</p>
                  
                  <div className="flex items-center justify-between pt-4 border-t border-slate-700/50">
                    <button 
                      onClick={() => isAdmin ? setShowRegList(event) : setShowDetail(event)}
                      className={`text-slate-500 text-sm flex items-center gap-1 ${isAdmin ? 'hover:text-amber-400 cursor-pointer' : ''}`}
                    >
                      <Icons.Users />
                      {(event.registrations || []).length} 人報名
                    </button>
                    
                    <div className="flex items-center gap-2">
                      <button 
                        onClick={() => setShowDetail(event)}
                        className="text-slate-400 text-sm flex items-center gap-1 hover:text-white"
                      >
                        <Icons.Info /> 詳情
                      </button>
                      
                      {event.status === 'active' && (
                        event.registrationLink ? (
                          <a 
                            href={event.registrationLink}
                            target="_blank"
                            rel="noopener noreferrer"
                            className="text-amber-400 text-sm font-medium flex items-center gap-1 hover:underline"
                          >
                            外部報名 <Icons.ExternalLink />
                          </a>
                        ) : event.enableLocalReg !== false && (
                          <button 
                            onClick={() => setShowRegForm(event)}
                            className="text-amber-400 text-sm font-medium flex items-center gap-1 hover:underline"
                          >
                            報名 <Icons.UserCheck />
                          </button>
                        )
                      )}
                    </div>
                  </div>
                </div>
              </div>
            ))}
          </div>

          {(showArchive ? archivedEvents : activeEvents).length === 0 && (
            <div className="text-center py-16 text-slate-500">
              <div className="mx-auto mb-4 opacity-50"><Icons.Calendar /></div>
              <p>{showArchive ? '尚無歷史活動' : '尚無進行中的活動'}</p>
            </div>
          )}

          {showEditor && (
            <EventEditor 
              event={editingEvent}
              onSave={handleSave}
              onClose={() => { setShowEditor(false); setEditingEvent(null); }}
            />
          )}

          {showRegForm && (
            <RegistrationForm
              event={showRegForm}
              onSubmit={(data) => handleRegister(showRegForm.id, data)}
              onClose={() => setShowRegForm(null)}
            />
          )}

          {showRegList && isAdmin && (
            <RegistrationList
              event={showRegList}
              onDelete={(regId) => handleDeleteReg(showRegList.id, regId)}
              onClose={() => setShowRegList(null)}
            />
          )}

          {showDetail && (
            <EventDetail
              event={showDetail}
              onRegister={() => { setShowDetail(null); setShowRegForm(showDetail); }}
              onClose={() => setShowDetail(null)}
            />
          )}
        </div>
      );
    }

    // ==================== 活動詳情彈窗 ====================
    function EventDetail({ event, onRegister, onClose }) {
      return (
        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 overflow-y-auto">
          <div className="glass rounded-2xl w-full max-w-2xl my-8 animate-fade-in overflow-hidden">
            {/* 活動圖片 */}
            <div className="relative h-64">
              <img 
                src={event.imageUrl || 'https://images.unsplash.com/photo-1540575467063-178a50c2df87?w=800'} 
                alt={event.title}
                className="w-full h-full object-cover"
              />
              <div className="absolute inset-0 bg-gradient-to-t from-slate-900 via-slate-900/50 to-transparent" />
              <button 
                onClick={onClose}
                className="absolute top-4 right-4 p-2 bg-black/50 backdrop-blur rounded-full text-white hover:bg-black/70"
              >
                <Icons.X />
              </button>
              <div className="absolute bottom-4 left-6 right-6">
                <span className={`inline-block px-3 py-1 rounded-full text-xs font-medium mb-2 ${
                  event.status === 'active' ? 'bg-emerald-500 text-white' : 'bg-slate-600 text-slate-300'
                }`}>
                  {event.status === 'active' ? '報名中' : '已結束'}
                </span>
                <h2 className="text-2xl font-bold text-white">{event.title}</h2>
              </div>
            </div>

            {/* 活動資訊 */}
            <div className="p-6 space-y-6">
              {/* 基本資訊 */}
              <div className="grid sm:grid-cols-2 gap-4">
                <div className="flex items-center gap-3 text-slate-300">
                  <div className="w-10 h-10 bg-amber-500/20 rounded-lg flex items-center justify-center">
                    <span className="text-amber-400"><Icons.Calendar /></span>
                  </div>
                  <div>
                    <p className="text-slate-500 text-sm">活動日期</p>
                    <p className="font-medium">{event.date}{event.endDate !== event.date && ` ~ ${event.endDate}`}</p>
                  </div>
                </div>
                
                {event.location && (
                  <div className="flex items-center gap-3 text-slate-300">
                    <div className="w-10 h-10 bg-blue-500/20 rounded-lg flex items-center justify-center">
                      <span className="text-blue-400"><Icons.MapPin /></span>
                    </div>
                    <div>
                      <p className="text-slate-500 text-sm">活動地點</p>
                      <p className="font-medium">{event.location}</p>
                    </div>
                  </div>
                )}
                
                <div className="flex items-center gap-3 text-slate-300">
                  <div className="w-10 h-10 bg-emerald-500/20 rounded-lg flex items-center justify-center">
                    <span className="text-emerald-400"><Icons.Users /></span>
                  </div>
                  <div>
                    <p className="text-slate-500 text-sm">報名人數</p>
                    <p className="font-medium">{(event.registrations || []).length} 人</p>
                  </div>
                </div>
              </div>

              {/* 活動內容 */}
              <div>
                <h3 className="text-white font-semibold mb-3">活動說明</h3>
                <div className="text-slate-400 whitespace-pre-wrap leading-relaxed">
                  {event.content}
                </div>
              </div>

              {/* 操作按鈕 */}
              <div className="flex gap-3 pt-4 border-t border-slate-700">
                <button onClick={onClose} className="flex-1 bg-slate-700 text-white py-3 rounded-lg hover:bg-slate-600">
                  關閉
                </button>
                {event.status === 'active' && event.enableLocalReg !== false && !event.registrationLink && (
                  <button onClick={onRegister} className="flex-1 gold-gradient text-slate-900 font-semibold py-3 rounded-lg hover:opacity-90">
                    立即報名
                  </button>
                )}
                {event.status === 'active' && event.registrationLink && (
                  <a 
                    href={event.registrationLink}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="flex-1 gold-gradient text-slate-900 font-semibold py-3 rounded-lg hover:opacity-90 text-center flex items-center justify-center gap-2"
                  >
                    前往報名 <Icons.ExternalLink />
                  </a>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ==================== 報名表單 ====================
    function RegistrationForm({ event, onSubmit, onClose }) {
      const [form, setForm] = useState({ name: '', email: '', phone: '', note: '' });

      const handleSubmit = () => {
        if (!form.name || !form.email) {
          alert('請填寫姓名和Email');
          return;
        }
        onSubmit(form);
      };

      return (
        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="glass rounded-2xl w-full max-w-md p-6 animate-fade-in">
            <div className="flex justify-between items-center mb-6">
              <h2 className="text-xl font-semibold text-white">活動報名</h2>
              <button onClick={onClose} className="text-slate-400 hover:text-white">
                <Icons.X />
              </button>
            </div>
            
            <div className="mb-4 p-4 bg-slate-800/50 rounded-lg">
              <h3 className="text-amber-400 font-medium">{event.title}</h3>
              <p className="text-slate-400 text-sm mt-1">{event.date}</p>
            </div>

            <div className="space-y-4">
              <div>
                <label className="text-slate-400 text-sm block mb-2">姓名 *</label>
                <input
                  type="text"
                  value={form.name}
                  onChange={(e) => setForm({ ...form, name: e.target.value })}
                  className="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-white focus:border-amber-400 focus:outline-none"
                  placeholder="請輸入姓名"
                />
              </div>
              
              <div>
                <label className="text-slate-400 text-sm block mb-2">Email *</label>
                <input
                  type="email"
                  value={form.email}
                  onChange={(e) => setForm({ ...form, email: e.target.value })}
                  className="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-white focus:border-amber-400 focus:outline-none"
                  placeholder="請輸入Email"
                />
              </div>
              
              <div>
                <label className="text-slate-400 text-sm block mb-2">聯絡電話</label>
                <input
                  type="tel"
                  value={form.phone}
                  onChange={(e) => setForm({ ...form, phone: e.target.value })}
                  className="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-white focus:border-amber-400 focus:outline-none"
                  placeholder="請輸入電話"
                />
              </div>
              
              <div>
                <label className="text-slate-400 text-sm block mb-2">備註</label>
                <textarea
                  value={form.note}
                  onChange={(e) => setForm({ ...form, note: e.target.value })}
                  rows={2}
                  className="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-white focus:border-amber-400 focus:outline-none resize-none"
                  placeholder="特殊需求或備註..."
                />
              </div>
            </div>
            
            <div className="flex gap-3 mt-6">
              <button onClick={onClose} className="flex-1 bg-slate-700 text-white py-3 rounded-lg hover:bg-slate-600">
                取消
              </button>
              <button onClick={handleSubmit} className="flex-1 gold-gradient text-slate-900 font-semibold py-3 rounded-lg hover:opacity-90">
                確認報名
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ==================== 報名名單（管理員） ====================
    function RegistrationList({ event, onDelete, onClose }) {
      const registrations = event.registrations || [];

      return (
        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="glass rounded-2xl w-full max-w-2xl p-6 animate-fade-in max-h-[80vh] overflow-hidden flex flex-col">
            <div className="flex justify-between items-center mb-6">
              <h2 className="text-xl font-semibold text-white flex items-center gap-2">
                <Icons.ClipboardList />
                報名名單
              </h2>
              <button onClick={onClose} className="text-slate-400 hover:text-white">
                <Icons.X />
              </button>
            </div>
            
            <div className="mb-4 p-4 bg-slate-800/50 rounded-lg">
              <h3 className="text-amber-400 font-medium">{event.title}</h3>
              <p className="text-slate-400 text-sm mt-1">共 {registrations.length} 人報名</p>
            </div>

            <div className="flex-1 overflow-y-auto scrollbar-thin">
              {registrations.length === 0 ? (
                <div className="text-center py-8 text-slate-500">
                  <Icons.Users />
                  <p className="mt-2">尚無報名紀錄</p>

                <table className="w-full">
                  <thead>
                    <tr className="text-slate-400 text-sm border-b border-slate-700">
                      <th className="text-left py-2 px-3">姓名</th>
                      <th className="text-left py-2 px-3">Email</th>
                      <th className="text-left py-2 px-3">電話</th>
                      <th className="text-left py-2 px-3">備註</th>
                      <th className="text-left py-2 px-3">日期</th>
                      <th className="text-right py-2 px-3">操作</th>
                    </tr>
                  </thead>
                  <tbody>
                    {registrations.map(reg => (
                      <tr key={reg.id} className="border-b border-slate-800 hover:bg-slate-800/30">
                        <td className="py-3 px-3 text-white">{reg.name}</td>
                        <td className="py-3 px-3 text-slate-400 text-sm">{reg.email}</td>
                        <td className="py-3 px-3 text-slate-400 text-sm">{reg.phone || '-'}</td>

                        <td className="py-3 px-3 text-slate-500 text-sm">{reg.date}</td>

            <div className="mt-4 pt-4 border-t border-slate-700">

              </button>
            </div>
          </div>
        </div>
      );

    // ==================== 活動編輯器（含圖片上傳） ====================
    function EventEditor({ event, onSave, onClose }) {
      const [form, setForm] = useState(event || {
        title: '',
        date: '',
        endDate: '',
        content: '',
        location: '',
        registrationLink: '',
        imageUrl: '',
        status: 'active',
        enableLocalReg: true
      });
      const fileInputRef = useRef(null);

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        
        if (file.size > 2 * 1024 * 1024) {
          alert('圖片大小不能超過 2MB');
          return;
        }

        const reader = new FileReader();
        reader.onload = (event) => {
          setForm({ ...form, imageUrl: event.target.result });
        };
        reader.readAsDataURL(file);
      };

      const handleSubmit = () => {
        if (!form.title || !form.date) {
          alert('請填寫活動名稱和日期');
          return;
        }
        onSave({ ...form, endDate: form.endDate || form.date });
      };

      return (
        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 overflow-y-auto">
          <div className="glass rounded-2xl w-full max-w-2xl p-6 my-8 animate-fade-in">
            <div className="flex justify-between items-center mb-6">
              <h2 className="text-xl font-semibold text-white">
                {event ? '編輯活動' : '新增活動'}
              </h2>
              <button onClick={onClose} className="text-slate-400 hover:text-white">
                <Icons.X />
              </button>
            </div>
            
            <div className="space-y-4 max-h-[60vh] overflow-y-auto scrollbar-thin pr-2">
              <div>
                <label className="text-slate-400 text-sm block mb-2">活動名稱 *</label>
                <input
                  type="text"
                  value={form.title}
                  onChange={(e) => setForm({ ...form, title: e.target.value })}
                  className="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-white focus:border-amber-400 focus:outline-none"
                  placeholder="請輸入活動名稱"
                />
              </div>
              
              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="text-slate-400 text-sm block mb-2">開始日期 *</label>
                  <input
                    type="date"
                    value={form.date}
                    onChange={(e) => setForm({ ...form, date: e.target.value })}
                    className="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-white focus:border-amber-400 focus:outline-none"
                  />
                </div>
                <div>
                  <label className="text-slate-400 text-sm block mb-2">結束日期</label>
                  <input
                    type="date"

    // ==================== 論壇交流（含標籤功能） ====================
    function ForumSection({ posts, canDelete, onSave, showNotif }) {
      const [showNewPost, setShowNewPost] = useState(false);
      const [expandedPost, setExpandedPost] = useState(null);
      const [replyText, setReplyText] = useState('');
      const [replyAuthor, setReplyAuthor] = useState('');
      const [newPost, setNewPost] = useState({ author: '', title: '', content: '', tags: [] });
      const [searchTag, setSearchTag] = useState('');
      const [searchText, setSearchText] = useState('');

      // 篩選文章
      const filteredPosts = posts.filter(post => {
        const matchTag = !searchTag || (post.tags || []).includes(searchTag);
        const matchText = !searchText || 
          post.title.toLowerCase().includes(searchText.toLowerCase()) ||
          post.content.toLowerCase().includes(searchText.toLowerCase()) ||
          post.author.toLowerCase().includes(searchText.toLowerCase());
        return matchTag && matchText;
      });

      const handleCreatePost = () => {
        if (!newPost.author || !newPost.title || !newPost.content) {
          alert('請填寫完整資料');
          return;
        }
        const post = {
          id: Date.now().toString(),
          author: newPost.author,
          avatar: newPost.author.charAt(0),
          title: newPost.title,
          content: newPost.content,
          tags: newPost.tags,
          date: new Date().toISOString().split('T')[0],
          likes: 0,
          replies: []
        };
        onSave([post, ...posts]);
        setNewPost({ author: '', title: '', content: '', tags: [] });
        setShowNewPost(false);
        showNotif('發文成功');
      };

      const handleDeletePost = (postId) => {
        if (confirm('確定要刪除此文章？')) {
          onSave(posts.filter(p => p.id !== postId));
          showNotif('文章已刪除');
        }
      };

      const handleLike = (postId) => {
        const updated = posts.map(p => 
          p.id === postId ? { ...p, likes: p.likes + 1 } : p
        );
        onSave(updated);
      };

      const handleReply = (postId) => {
        if (!replyText.trim() || !replyAuthor.trim()) {
          alert('請輸入暱稱和回覆內容');
          return;
        }
        const updated = posts.map(p => {
          if (p.id === postId) {
            return {
              ...p,
              replies: [...p.replies, {
                id: Date.now().toString(),
                author: replyAuthor,
                avatar: replyAuthor.charAt(0),
                content: replyText,
                date: new Date().toISOString().split('T')[0],
                likes: 0
              }]
            };
          }
          return p;
        });
        onSave(updated);
        setReplyText('');
        setReplyAuthor('');
        showNotif('回覆成功');
      };

      const toggleTag = (tag) => {
        if (newPost.tags.includes(tag)) {
          setNewPost({ ...newPost, tags: newPost.tags.filter(t => t !== tag) });
        } else if (newPost.tags.length < 3) {
          setNewPost({ ...newPost, tags: [...newPost.tags, tag] });
        }
      };

      return (
        <div className="space-y-8">
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
              <h2 className="text-2xl font-bold text-white flex items-center gap-3">
                <span className="text-amber-400"><Icons.MessageSquare /></span>
                組員交流
              </h2>
              <p className="text-slate-400 mt-1">分享見解，碰撞智慧火花</p>
            </div>
            
            <button
              onClick={() => setShowNewPost(true)}
              className="gold-gradient text-slate-900 font-semibold px-5 py-2 rounded-lg flex items-center gap-2 hover:opacity-90"
            >
              <Icons.Plus />
              發起討論
            </button>
          </div>

          {/* 搜尋與標籤篩選 */}
          <div className="glass rounded-xl p-4 space-y-4">
            <div className="flex gap-3">
              <div className="flex-1 relative">
                <input
                  type="text"
                  value={searchText}
                  onChange={(e) => setSearchText(e.target.value)}
                  placeholder="搜尋文章..."
                  className="w-full bg-slate-800 border border-slate-700 rounded-lg pl-10 pr-4 py-2 text-white focus:border-amber-400 focus:outline-none"
                  style={{ paddingLeft: '2.5rem' }}
                />
                <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500">
                  <Icons.Search />
                </span>
              </div>
            </div>
            
            <div className="flex flex-wrap gap-2">
              <span className="text-slate-400 text-sm flex items-center gap-1">
                <Icons.Tag /> 標籤篩選：
              </span>
              <button
                onClick={() => setSearchTag('')}
                className={`px-3 py-1 rounded-full text-sm transition-colors ${
                  !searchTag ? 'bg-amber-400/20 text-amber-400' : 'bg-slate-700 text-slate-400 hover:bg-slate-600'
                }`}
              >
                全部
              </button>
              {defaultTags.map(tag => (
                <button
                  key={tag}
                  onClick={() => setSearchTag(searchTag === tag ? '' : tag)}
                  className={`px-3 py-1 rounded-full text-sm transition-colors ${
                    searchTag === tag ? 'bg-amber-400/20 text-amber-400' : 'bg-slate-700 text-slate-400 hover:bg-slate-600'
                  }`}
                >
                  {tag}
                </button>
              ))}
            </div>
          </div>

          {/* 文章列表 */}
          <div className="space-y-4">
            {filteredPosts.map(post => (
              <div key={post.id} className="glass rounded-2xl p-6 hover-lift">
                <div className="flex items-start gap-4">
                  <div className="w-12 h-12 gold-gradient rounded-full flex items-center justify-center text-slate-900 font-bold flex-shrink-0">
                    {post.avatar}
                  </div>
                  
                  <div className="flex-1 min-w-0">
                    <div className="flex items-center justify-between">
                      <div className="flex items-center gap-2 mb-1 flex-wrap">
                        <span className="text-white font-medium">{post.author}</span>
                        <span className="text-slate-500 text-sm">· {post.date}</span>
                      </div>
                      {canDelete && (
                        <button 
                          onClick={() => handleDeletePost(post.id)}
                          className="p-1.5 hover:bg-red-500/20 rounded text-red-400"
                        >
                          <Icons.Trash2 />
                        </button>
                      )}
                    </div>
                    
                    {/* 標籤 */}
                    {post.tags && post.tags.length > 0 && (
                      <div className="flex flex-wrap gap-1 mb-2">
                        {post.tags.map(tag => (
                          <span 
                            key={tag}
                            onClick={() => setSearchTag(tag)}
                            className="px-2 py-0.5 bg-amber-400/10 text-amber-400 text-xs rounded-full cursor-pointer hover:bg-amber-400/20"
                          >
                            #{tag}
                          </span>
                        ))}
                      </div>
                    )}
                    
                    <h3 className="text-lg font-semibold text-white mb-2">{post.title}</h3>
                    <p className="text-slate-400 whitespace-pre-wrap">{post.content}</p>
                    
                    <div className="flex items-center gap-4 mt-4 pt-4 border-t border-slate-700/50">
                      <button 
                        onClick={() => handleLike(post.id)}
                        className="flex items-center gap-2 text-slate-400 hover:text-red-400 transition-colors"
                      >
                        <Icons.Heart />
                        <span>{post.likes}</span>
                      </button>
                      
                      <button 
                        onClick={() => setExpandedPost(expandedPost === post.id ? null : post.id)}
                        className="flex items-center gap-2 text-slate-400 hover:text-amber-400 transition-colors"
                      >
                        <Icons.MessageCircle />
                        <span>{post.replies.length} 回覆</span>
                      </button>
                    </div>
                    
                    {expandedPost === post.id && (
                      <div className="mt-4 space-y-4 animate-fade-in">
                        {post.replies.map(reply => (
                          <div key={reply.id} className="flex gap-3 pl-4 border-l-2 border-slate-700">
                            <div className="w-8 h-8 bg-slate-700 rounded-full flex items-center justify-center text-slate-300 text-sm flex-shrink-0">
                              {reply.avatar}
                            </div>
                            <div>
                              <div className="flex items-center gap-2">
                                <span className="text-slate-300 font-medium text-sm">{reply.author}</span>
                                <span className="text-slate-500 text-xs">{reply.date}</span>
                              </div>
                              <p className="text-slate-400 text-sm mt-1">{reply.content}</p>
                            </div>
                          </div>
                        ))}
                        
                        {/* 回覆輸入區（含暱稱） */}
                        <div className="space-y-2 mt-4 p-3 bg-slate-800/50 rounded-lg">
                          <input
                            type="text"
                            value={replyAuthor}
                            onChange={(e) => setReplyAuthor(e.target.value)}
                            placeholder="您的暱稱..."
                            className="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-white text-sm focus:border-amber-400 focus:outline-none"
                          />
                          <div className="flex gap-2">
                            <input
                              type="text"
                              value={replyText}
                              onChange={(e) => setReplyText(e.target.value)}
                              placeholder="輸入回覆..."
                              className="flex-1 bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 text-white text-sm focus:border-amber-400 focus:outline-none"
                              onKeyDown={(e) => e.key === 'Enter' && handleReply(post.id)}
                            />
                            <button 
                              onClick={() => handleReply(post.id)}
                              className="p-2 bg-amber-400/20 text-amber-400 rounded-lg hover:bg-amber-400/30"
                            >
                              <Icons.Send />
                            </button>
                          </div>
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            ))}
          </div>

          {filteredPosts.length === 0 && (
            <div className="text-center py-16 text-slate-500">
              <div className="mx-auto mb-4 opacity-50"><Icons.MessageSquare /></div>
              <p>{searchTag || searchText ? '找不到符合條件的文章' : '尚無討論，來發起第一篇吧！'}</p>
            </div>
          )}

          {/* 發文對話框（含標籤） */}
          {showNewPost && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 overflow-y-auto">
              <div className="glass rounded-2xl w-full max-w-lg p-6 my-8 animate-fade-in">
                <div className="flex justify-between items-center mb-6">
                  <h2 className="text-xl font-semibold text-white">發起討論</h2>
                  <button onClick={() => setShowNewPost(false)} className="text-slate-400 hover:text-white">
                    <Icons.X />
                  </button>
                </div>
                
                <div className="space-y-4">
                  <div>
                    <label className="text-slate-400 text-sm block mb-2">您的姓名</label>
                    <input
                      type="text"
                      value={newPost.author}
                      onChange={(e) => setNewPost({ ...newPost, author: e.target.value })}
                      className="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-white focus:border-amber-400 focus:outline-none"
                      placeholder="請輸入姓名"
                    />
                  </div>
                  
                  <div>
                    <label className="text-slate-400 text-sm block mb-2">標題</label>
                    <input
                      type="text"
                      value={newPost.title}
                      onChange={(e) => setNewPost({ ...newPost, title: e.target.value })}
                      className="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-white focus:border-amber-400 focus:outline-none"
                      placeholder="請輸入討論標題"
                    />
                  </div>

                  {/* 標籤選擇 */}
                  <div>
                    <label className="text-slate-400 text-sm block mb-2">標籤（最多3個）</label>
                    <div className="flex flex-wrap gap-2">
                      {defaultTags.map(tag => (
                        <button
                          key={tag}
                          onClick={() => toggleTag(tag)}
                          className={`px-3 py-1 rounded-full text-sm transition-colors ${
                            newPost.tags.includes(tag) 
                              ? 'bg-amber-400 text-slate-900' 
                              : 'bg-slate-700 text-slate-400 hover:bg-slate-600'
                          }`}
                        >
                          {tag}
                        </button>
                      ))}
                    </div>
                  </div>
                  
                  <div>
                    <label className="text-slate-400 text-sm block mb-2">內容</label>
                    <textarea
                      value={newPost.content}
                      onChange={(e) => setNewPost({ ...newPost, content: e.target.value })}
                      rows={5}
                      className="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-white focus:border-amber-400 focus:outline-none resize-none"
                      placeholder="分享您的想法..."
                    />
                  </div>
                </div>
                
                <div className="flex gap-3 mt-6">
                  <button onClick={() => setShowNewPost(false)} className="flex-1 bg-slate-700 text-white py-3 rounded-lg hover:bg-slate-600">
                    取消
                  </button>
                  <button onClick={handleCreatePost} className="flex-1 gold-gradient text-slate-900 font-semibold py-3 rounded-lg hover:opacity-90">
                    發佈
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==================== 渲染應用程式 ====================
    ReactDOM.render(<EMBAPortal />, document.getElementById('root'));
  </script>
</body>
</html>
